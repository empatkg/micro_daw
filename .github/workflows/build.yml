name: Build Native Engine & Flutter DAW

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux-native:
    name: Build C++ Shared Library (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Audio & C++ Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libsysfs-dev freeglut3-dev libgtk-3-dev

      - name: Configure CMake
        run: cmake -B native/build -S native -DCMAKE_BUILD_TYPE=Release

      - name: Build Tracktion Bridge Shared Library
        run: cmake --build native/build --config Release -j$(nproc)

      - name: Upload Linux Shared Library (.so)
        uses: actions/upload-artifact@v4
        with:
          name: libtracktion_bridge_linux
          path: native/build/libtracktion_bridge.so

  build-android-apk:
    name: Build Android Shared Library & APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build C++ Library for Android (arm64-v8a)
        run: |
          mkdir -p native/build_android_arm64
          cmake -B native/build_android_arm64 -S native \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build_android_arm64 --config Release -j$(nproc)

      - name: Copy Shared Library to JNI Folders
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp native/build_android_arm64/libtracktion_bridge.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Flutter APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micro_daw_debug_apk
          path: build/app/outputs/flutter-apk/app-debug.apk
