name: Build Micro DAW (Windows & Android)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    name: Build Windows (.dll & Executable)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure & Build C++ Shared Library (MSVC)
        run: |
          cmake -B native/build -S native -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --config Release --parallel

      - name: Enable & Create Windows Desktop Support
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .

      - name: Build Flutter Windows Release
        run: flutter build windows --release

      - name: Copy DLL to Output Directory
        run: |
          copy native\build\Release\tracktion_bridge.dll build\windows\x64\runner\Release\

      - name: Upload Windows App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micro_daw_windows_x64
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android (arm64-v8a & APK)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Stable Android NDK (r26b)
        run: |
          sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build C++ Library for Android (arm64-v8a)
        run: |
          mkdir -p native/build_android_arm64
          cmake -B native/build_android_arm64 -S native \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build_android_arm64 --config Release -j$(nproc)

      - name: Copy Shared Library to JNI Folders
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp native/build_android_arm64/libtracktion_bridge.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Flutter APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micro_daw_debug_apk
          path: build/app/outputs/flutter-apk/app-debug.apk